[project]
name = "machinable"
version = "0.1.0"
description = "PDF-first raw-stock recommendation pilot for CNC machinists"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=2.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
